name: Check site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render and check links
        run: |
          python3 scripts/build_site.py
          python3 scripts/check_links.py
      - name: Check newsletter delivery with simulated subscribers
        run: node --test newsletter/newsletter.test.cjs
      - name: Require regenerated pages in the commit
        run: |
          changes=$(git status --porcelain -- docs)
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
