<header class="page-heading reach-heading wrap">
  <h1>Anemone around the world.</h1>
  <p class="lede">Explore the countries our contributors call home and where our readers find us.</p>
</header>
<section class="wrap section reach" aria-label="Magazine reach by country">
  <fieldset class="reach-switcher">
    <legend class="visually-hidden">Choose an audience</legend>
    <input class="visually-hidden" type="radio" name="reach-audience" id="show-contributors" checked>
    <label for="show-contributors">Contributors</label>
    <input class="visually-hidden" type="radio" name="reach-audience" id="show-readers">
    <label for="show-readers">Readers</label>
    {{reach_audiences}}
  </fieldset>
  <p class="reach-credit small">Map boundaries from <a href="https://www.naturalearthdata.com/downloads/50m-cultural-vectors/">Natural Earth</a>.</p>
</section>
