<header class="page-heading page-heading-art wrap">
  <div class="page-intro">
    <p class="eyebrow">The archive</p>
    <h1>Read Anemone.</h1>
    <p class="lede">Browse our open-theme issues and special editions.</p>
    <div class="actions archive-jumps">
      <a class="text-link" href="#general">General issues</a>
      <a class="text-link" href="#themed">Themed issues</a>
    </div>
  </div>
  {{page_artwork}}
</header>
<div class="wrap archive-tools" hidden>
  <form class="archive-filters" role="search" aria-label="Filter the issue archive">
    <div>
      <label for="archive-search">Search issues</label>
      <input id="archive-search" name="query" type="search" placeholder="Try Pride or Issue 9" autocomplete="off">
    </div>
    <div>
      <label for="archive-type">Issue type</label>
      <select id="archive-type" name="type">
        <option value="">All types</option>
        <option value="general">General</option>
        <option value="themed">Themed</option>
      </select>
    </div>
    <div>
      <label for="archive-year">Year</label>
      <select id="archive-year" name="year">
        <option value="">All years</option>
        {{archive_years}}
      </select>
    </div>
    <button class="button archive-reset" type="reset">Clear filters</button>
  </form>
  <p class="archive-status" role="status"></p>
</div>
<section class="wrap archive-group" data-issue-group="general" aria-labelledby="general">
  <h2 id="general">General issues</h2>
  <div class="issue-grid">{{general_issues}}</div>
</section>
<section class="wrap archive-group" data-issue-group="themed" aria-labelledby="themed">
  <h2 id="themed">Themed issues</h2>
  <div class="issue-grid">{{themed_issues}}</div>
</section>
<script src="{{root}}assets/archive.js" defer></script>
