<section class="analytics-notice" id="analytics-notice" aria-labelledby="analytics-title" hidden>
  <div>
    <h2 id="analytics-title" tabindex="-1">Analytics cookies</h2>
    <p>Google Analytics helps us understand which pages readers visit. <a href="{{root}}privacy-policy/#analytics">About analytics</a></p>
  </div>
  <div class="analytics-actions">
    <button class="button" type="button" data-analytics-choice="denied">Decline</button>
    <button class="button" type="button" data-analytics-choice="granted">Allow analytics</button>
  </div>
</section>
<script src="{{root}}assets/analytics.js?v={{analytics_version}}" data-measurement-id="{{analytics_id}}" defer></script>
